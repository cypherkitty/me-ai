# https://taskfile.dev
version: "3"

vars:
  WEB_DIR: me-ai-web
  CORE_DIR: me-ai-core
  CORE_PKG: '{{.CORE_DIR}}/pkg'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # --- Dependencies ---
  install:
    desc: "Build core then install npm deps (me-ai-core is file: link, so pkg must exist first)"
    deps:
      - task: build:core
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm install

  # --- me-ai-core (Rust WASM, blueprint: duckdb-wasm-shell style) ---
  build:core:
    desc: Build me-ai-core with wasm-pack --target web (output in me-ai-core/pkg; no custom bindings)
    cmds:
      - wasm-pack build {{.CORE_DIR}} --target web --out-dir {{.CORE_PKG}}

  # --- Full product build ---
  build:
    desc: Build full product (core + web); needs install so node_modules/me-ai-core exists
    deps:
      - task: install
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run build

  build:web:
    desc: Build only me-ai-web (no Rust core; use when core is already built or not needed)
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run build

  # --- Dev server (use stable Rust for build:core if needed) ---
  dev:
    desc: Run Vite dev server (core must be built first; use task install once)
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run dev

  # --- Tests ---
  test:
    desc: Run unit tests (Vitest, single run for CI)
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run test:ci

  test:e2e:
    desc: Run E2E tests (Playwright); installs Chromium if needed
    dir: '{{.WEB_DIR}}'
    cmds:
      - npx playwright install --with-deps chromium
      - npx playwright test

  # --- Checks ---
  check:
    desc: Run Svelte/TypeScript check
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run check

  # --- CI: install (core + npm) then unit + e2e ---
  ci:
    desc: Full CI run (build:core → install → unit tests → E2E tests)
    deps:
      - task: install
    cmds:
      - task: test
      - task: test:e2e

  # --- Deploy: install then full build ---
  deploy-build:
    desc: Build core, install deps, then build web for deploy/preview
    deps:
      - task: install
    cmds:
      - task: build
