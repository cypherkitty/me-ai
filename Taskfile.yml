# https://taskfile.dev
version: "3"

vars:
  WEB_DIR: me-ai-web
  CORE_DIR: me-ai-core
  CORE_PKG: "{{.CORE_DIR}}/pkg"
  WASM_DEST: "{{.WEB_DIR}}/public/wasm"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # --- Dependencies ---
  install:
    desc: Install npm dependencies for me-ai-web
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm install

  # --- me-ai-core (Rust WASM) ---
  build:core:
    desc: Build me-ai-core with wasm-pack and copy JS/WASM to me-ai-web/public/wasm
    cmds:
      - wasm-pack build {{.CORE_DIR}} --target web --out-dir {{.CORE_PKG}}
      - mkdir -p {{.WASM_DEST}}
      - cp {{.CORE_PKG}}/me_ai_core.js {{.CORE_PKG}}/me_ai_core_bg.wasm {{.WASM_DEST}}/

  # --- Full product build ---
  build:
    desc: Build full product (me-ai-core + me-ai-web)
    deps:
      - task: build:core
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run build

  build:web:
    desc: Build only me-ai-web (no Rust core; use when core is already built or not needed)
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run build

  # --- Tests ---
  test:
    desc: Run unit tests (Vitest, single run for CI)
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run test:ci

  test:e2e:
    desc: Run E2E tests (Playwright); installs Chromium if needed
    dir: "{{.WEB_DIR}}"
    cmds:
      - npx playwright install --with-deps chromium
      - npx playwright test

  # --- Checks ---
  check:
    desc: Run Svelte/TypeScript check
    dir: "{{.WEB_DIR}}"
    cmds:
      - npm run check

  # --- CI: build core (for npm dep) + install + unit + e2e ---
  ci:
    desc: Full CI run (install, unit tests, E2E tests)
    deps:
      - build:core
      - install
    cmds:
      - task: test
      - task: test:e2e

  # --- Deploy: build core (for npm dep) + install + full build ---
  deploy-build:
    desc: Install deps and build full product for deploy/preview
    deps:
      - build:core
      - install
    cmds:
      - task: build
