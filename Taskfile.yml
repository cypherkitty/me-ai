# https://taskfile.dev
version: "3"

# build:core writes to me-ai-core/pkg. install runs build:core then npm install;
# package.json has "me-ai-core": "file:../me-ai-core/pkg", so node_modules/me-ai-core
# is a symlink to that pkg. Vite and static-copy consume from node_modules/me-ai-core.

vars:
  WEB_DIR: me-ai-web
  CORE_DIR: me-ai-core
  CORE_PKG: '{{.CORE_DIR}}/pkg'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # --- Dependencies ---
  install:
    desc: "Build core, npm install, then copy pkg to node_modules/me-ai-core"
    deps:
      - task: build:core
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm install
      - task: copy:core

  install:ci:
    desc: "Build core, install npm deps with a CI-safe retry path, then copy pkg to node_modules/me-ai-core"
    deps:
      - task: build:core
    dir: '{{.WEB_DIR}}'
    cmds:
      - |
        bash -lc '
          set -euo pipefail
          if npm install --foreground-scripts; then
            exit 0
          fi

          echo "npm install failed; retrying once after clearing esbuild to recover from transient install races..." >&2
          rm -rf node_modules/esbuild
          npm install --foreground-scripts
        '
      - task: copy:core

  # --- me-ai-core (Rust WASM) ---
  # wasm-pack writes to CORE_DIR/pkg (e.g. me-ai-core/pkg); sync to CORE_PKG for install/copy.
  build:core:
    desc: Build me-ai-core with wasm-pack --target web (output in me-ai-core/pkg)
    cmds:
      - wasm-pack build {{.CORE_DIR}} --target web --out-dir pkg

  copy:core:
    desc: Copy me-ai-core/pkg into me-ai-web/node_modules/me-ai-core (run after build:core)
    cmds:
      - rm -rf {{.WEB_DIR}}/node_modules/me-ai-core
      - cp -r {{.CORE_PKG}} {{.WEB_DIR}}/node_modules/me-ai-core

  # --- Full product build ---
  build:
    desc: Build full product (core + web); needs install so node_modules/me-ai-core exists
    deps:
      - task: install
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run build

  build:web:
    desc: Build only me-ai-web (no Rust core; use when core is already built or not needed)
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run build

  # --- Dev server (use stable Rust for build:core if needed) ---
  dev:
    desc: Run Vite dev server (assumes core is already built; run task install once first)
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run dev

  restart:
    desc: Clean WASM, rebuild core, kill dev server, reinstall, start fresh
    cmds:
      - rm -rf {{.CORE_PKG}}
      - task: build:core
      - task: copy:core
      - task: kill:dev
      - cd {{.WEB_DIR}} && npm run dev

  kill:dev:
    desc: Kill all npm/Vite dev servers
    cmds:
      - pkill -f "vite" || true
      - pkill -f "npm run dev" || true

  # --- Tests ---
  test:core:
    desc: Run me-ai-core Rust unit tests (native target, lib only)
    cmds:
      - cargo test --manifest-path {{.CORE_DIR}}/Cargo.toml --lib

  clippy:core:
    desc: Run Clippy on me-ai-core (wasm32 target, deny warnings)
    cmds:
      - cargo clippy --manifest-path {{.CORE_DIR}}/Cargo.toml --target wasm32-unknown-unknown -- -D warnings

  test:
    desc: Run all unit tests (Rust core + Vitest web, single run for CI)
    deps:
      - task: test:core
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run test:ci

  test:e2e:
    desc: Run E2E tests (Playwright); installs Chromium if needed
    dir: '{{.WEB_DIR}}'
    cmds:
      - npx playwright install --with-deps chromium
      - npx playwright test

  # --- Checks ---
  check:
    desc: Run Svelte/TypeScript check
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run check

  lint:
    desc: Run ESLint on me-ai-web/src
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run lint

  knip:
    desc: Find unused exports and dead code in me-ai-web/src
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run knip

  # --- CI: install (core + npm) then unit + e2e ---
  ci:
    desc: Full CI run (build:core → install:ci → clippy:core → check → lint → unit tests → E2E tests)
    deps:
      - task: install:ci
    cmds:
      - task: clippy:core
      - task: check
      - task: lint
      - task: test
      - task: test:e2e

  # --- Deploy: install then full build ---
  deploy-build:
    desc: Build core, install deps reproducibly for CI/deploy, then build web
    deps:
      - task: install:ci
    cmds:
      - task: build:web
