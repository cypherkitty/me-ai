# https://taskfile.dev
# Root Taskfile — includes and cross-package orchestration only.
#
# Rule: a task belongs here only if it must coordinate across multiple namespaces.
# Single-package tasks live in their own Taskfile:
#   core:*    me-ai-core/Taskfile.yml   (runs from me-ai-core/)
#   web:*     me-ai-web/Taskfile.yml    (runs from me-ai-web/)
#   cortex:*  tools/cortex-check/Taskfile.yml  (runs from repo root)
version: "3"

includes:
  core:
    taskfile: ./me-ai-core/Taskfile.yml
    dir: ./me-ai-core
  web:
    taskfile: ./me-ai-web/Taskfile.yml
    dir: ./me-ai-web
  cortex:
    taskfile: ./tools/cortex-check/Taskfile.yml

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # Cross-package: core:build must complete before web:install can run.
  install:
    desc: "core:build → web:install"
    deps:
      - task: core:build
    cmds:
      - task: web:install

  install:ci:
    desc: "core:build → web:install:ci (CI-safe retry)"
    deps:
      - task: core:build
    cmds:
      - task: web:install:ci

  # Cross-package: wipes WASM output, rebuilds core, syncs to web, restarts dev server.
  restart:
    desc: "Clean WASM → core:build → web:copy-core → web:kill-dev → web:dev"
    cmds:
      - rm -rf me-ai-core/pkg
      - task: core:build
      - task: web:copy-core
      - task: web:kill-dev
      - task: web:dev

  # Cross-package: calls tasks from core:, web:, and cortex: namespaces.
  ci:
    desc: >
      Full CI pipeline:
      install:ci → cortex:check → core:clippy → web:format:check →
      web:check → web:lint → web:knip → core:test → web:test → web:test:e2e
    deps:
      - task: install:ci
    cmds:
      - task: cortex:check
      - task: core:clippy
      - task: web:format:check
      - task: web:check
      - task: web:lint
      - task: web:knip
      - task: core:test
      - task: web:test
      - task: web:test:e2e

  deploy-build:
    desc: "install:ci → web:build (used by deploy and preview workflows)"
    deps:
      - task: install:ci
    cmds:
      - task: web:build
