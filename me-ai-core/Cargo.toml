[package]
name = "me-ai-core"
version = "0.1.0"
edition = "2021"
description = "Rust WASM core: business logic and IndexedDB persistence via Rexie"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Error handling (aligned with meta-secret-core)
thiserror = "2.0.18"
anyhow = "1.0.101"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.58"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["alloc", "std"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal", "console", "Location", "Window", "Performance"] }
serde-wasm-bindgen = "0.6.5"
rexie = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-openai = { version = "0.33", default-features = false, features = ["responses"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
regex-lite = "0.1"
sha2 = "0.10"
urlencoding = "2.1"
scraper = { version = "0.22", default-features = false }
tsify-next = { version = "0.5", default-features = false, features = ["js"] }
async-trait = "0.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
