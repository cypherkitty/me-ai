[package]
name = "me-ai-core"
version = "0.1.0"
edition = "2021"
description = "Rust WASM core: business logic and type-safe DuckDB queries via sea-query"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
sea-query = { version = "0.31", default-features = false, features = ["backend-sqlite"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
