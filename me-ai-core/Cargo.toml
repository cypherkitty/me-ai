[package]
name = "me-ai-core"
version = "0.1.0"
edition = "2021"
description = "Rust WASM core: business logic and IndexedDB persistence via Rexie"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Error handling (aligned with meta-secret-core)
thiserror = "2.0.18"
anyhow = "1.0.101"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.58"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
serde-wasm-bindgen = "0.6.5"
rexie = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
async-openai = { version = "0.33", default-features = false, features = ["responses"] }
base64 = { version = "0.22", default-features = false, features = ["std"] }
regex-lite = "0.1"
tsify-next = { version = "0.5", default-features = false, features = ["js"] }
async-trait = "0.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
