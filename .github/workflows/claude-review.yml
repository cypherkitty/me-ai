name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request for the me-ai project — a browser-only AI assistant (no backend server).

            Focus on:
            - **Correctness** — logic bugs, off-by-one errors, race conditions
            - **Security** — XSS, injection, unsafe credential handling, OAuth flows
            - **Architecture** — no core logic leaking into web layer (me-ai-core vs me-ai-web separation)
            - **Rust/WASM** — memory safety, panic paths, proper WASM API surface
            - **Svelte/TS** — reactivity bugs, type safety, proper shadcn-svelte usage
            - **No fallbacks** — flag any code that degrades gracefully instead of failing explicitly

            Post inline review comments on specific lines where issues are found.
            Summarize findings at the end of your review.
