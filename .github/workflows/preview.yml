name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: me-ai-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: me-ai-web/package.json

      - name: Install and Build
        if: github.event.action != 'closed'
        run: |
          npm install
          npm run build
        env:
          VITE_BASE: "./"

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: me-ai-web/dist/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
